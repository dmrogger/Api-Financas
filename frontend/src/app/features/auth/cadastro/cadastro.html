<app-auth-layout titulo="Crie sua conta" subtitulo="Leva menos de um minuto. Depois é só começar a lançar.">
  <form [formGroup]="form" (ngSubmit)="cadastrar()">
    <mat-form-field>
      <mat-label>Nome</mat-label>
      <mat-icon matPrefix>person</mat-icon>
      <input matInput formControlName="nome" autocomplete="name" />
      <mat-error>Informe o nome (até 150 caracteres)</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>E-mail</mat-label>
      <mat-icon matPrefix>mail</mat-icon>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      <mat-error>Informe um e-mail válido</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Senha</mat-label>
      <mat-icon matPrefix>lock</mat-icon>
      <input matInput type="password" formControlName="senha" autocomplete="new-password" />
      <mat-hint>{{ dicaSenha }}</mat-hint>
      <mat-error>{{ dicaSenha }}</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Confirmar senha</mat-label>
      <mat-icon matPrefix>lock_reset</mat-icon>
      <input matInput type="password" formControlName="confirmacao" autocomplete="new-password" />
      <mat-error>Confirme a senha</mat-error>
    </mat-form-field>

    @if (form.hasError('senhasDiferentes') && form.controls.confirmacao.touched) {
      <span class="aviso-erro">As senhas não conferem.</span>
    }

    <button mat-flat-button class="acao-principal" type="submit" [disabled]="enviando()">
      @if (enviando()) {
        <mat-spinner diameter="20" />
      } @else {
        Criar conta
      }
    </button>
  </form>

  <p class="rodape">
    Já tem conta? <a routerLink="/login">Entrar</a>
  </p>
</app-auth-layout>
