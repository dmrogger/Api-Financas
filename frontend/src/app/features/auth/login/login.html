<app-auth-layout titulo="Bem-vindo de volta 👋" subtitulo="Entre com seu e-mail e senha para continuar.">
  <form [formGroup]="form" (ngSubmit)="entrar()">
    <mat-form-field>
      <mat-label>E-mail</mat-label>
      <mat-icon matPrefix>mail</mat-icon>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.hasError('required')) {
        <mat-error>Informe o e-mail</mat-error>
      } @else if (form.controls.email.hasError('email')) {
        <mat-error>E-mail inválido</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Senha</mat-label>
      <mat-icon matPrefix>lock</mat-icon>
      <input
        matInput
        [type]="mostrarSenha() ? 'text' : 'password'"
        formControlName="senha"
        autocomplete="current-password"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="mostrarSenha.set(!mostrarSenha())"
        [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
      >
        <mat-icon>{{ mostrarSenha() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>Informe a senha</mat-error>
    </mat-form-field>

    <button mat-flat-button class="acao-principal" type="submit" [disabled]="enviando()">
      @if (enviando()) {
        <mat-spinner diameter="20" />
      } @else {
        Entrar
      }
    </button>
  </form>

  <p class="rodape">
    Ainda não tem conta? <a routerLink="/cadastro">Criar conta grátis</a>
  </p>
</app-auth-layout>
